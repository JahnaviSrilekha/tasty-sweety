[project]
name = "tasty-sweety-api"
version = "0.1.0"
description = "Backend for Tasty Sweety (spec 001)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "anthropic[bedrock]>=2.3.0",
    "ag-ui-protocol>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "jsonschema",
    "ruff",
    "pyyaml>=6.0.3",
    "referencing>=0.37.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
