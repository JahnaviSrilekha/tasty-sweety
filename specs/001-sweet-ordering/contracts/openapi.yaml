openapi: 3.1.0
info:
  title: Tasty Sweety API
  version: 0.1.0
  description: |
    Backend for spec 001 (sweet ordering). All money values are integers in paise.
    The assistant endpoint (/agent) streams AG-UI events; see design.md section 5.
servers:
  - url: http://localhost:8000

paths:
  /health:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { status: { const: ok } }, required: [status] }

  /catalog:
    get:
      summary: The catalog (REQ-1)
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema: { $ref: "../../../shared/catalog.schema.json" }

  /quote:
    post:
      summary: Price a list of lines (AC-4.3)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinesRequest" }
      responses:
        "200":
          description: Priced lines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "422": { $ref: "#/components/responses/Error" }

  /orders:
    post:
      summary: Place an order (REQ-4)
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceOrderRequest" }
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "200":
          description: Same Idempotency-Key seen before; the first order is returned (AC-4.5)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409":
          description: expectedTotal does not match the server total (AC-4.3). Body carries the new quote.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { $ref: "#/components/schemas/ErrorBody" }
                  quote: { $ref: "#/components/schemas/Quote" }
                required: [error, quote]
        "422": { $ref: "#/components/responses/Error" }

  /orders/{id}:
    get:
      summary: Get an order's public status, without customer details (AC-5.1, AC-5.5)
      parameters:
        - { $ref: "#/components/parameters/OrderId" }
      responses:
        "200":
          description: Public order status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicOrder" }
        "404": { $ref: "#/components/responses/Error" }

  /owner/orders:
    get:
      summary: List orders, newest first (AC-5.4)
      security: [{ ownerKey: [] }]
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Order" } }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /owner/orders/{id}/stage:
    post:
      summary: Change an order's stage (AC-5.2, AC-5.3)
      security: [{ ownerKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrderId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { to: { $ref: "#/components/schemas/Stage" } }
              required: [to]
              additionalProperties: false
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Transition not allowed (code invalid_transition)
          content:
            application/json:
              schema: { type: object, properties: { error: { $ref: "#/components/schemas/ErrorBody" } }, required: [error] }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /agent:
    post:
      summary: Order assistant run (REQ-3), AG-UI over Server-Sent Events
      description: |
        Request body is an AG-UI RunAgentInput. The last user message is the text to understand.
        Response is a text/event-stream of AG-UI events in the order given in design.md section 5.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                threadId: { type: string }
                runId: { type: string }
                messages: { type: array, items: { type: object } }
                state: { type: object }
                tools: { type: array, items: { type: object } }
                context: { type: array, items: { type: object } }
                forwardedProps: { type: object }
              required: [threadId, runId, messages]
      responses:
        "200":
          description: AG-UI event stream
          content:
            text/event-stream:
              schema: { type: string }
        "422": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    ownerKey: { type: apiKey, in: header, name: X-Owner-Key }

  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^TS-\\d{8}-\\d{4}$" }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties: { error: { $ref: "#/components/schemas/ErrorBody" } }
            required: [error]

  schemas:
    SizeId: { type: string, enum: [small, medium, large] }
    Stage: { type: string, enum: [placed, confirmed, ready, completed, cancelled] }

    Line:
      type: object
      properties:
        sweetId: { type: string }
        size: { $ref: "#/components/schemas/SizeId" }
        qty: { type: integer, minimum: 1, maximum: 99 }
      required: [sweetId, size, qty]
      additionalProperties: false

    PricedLine:
      description: A Line with server prices. Written out in full because Line forbids extra fields.
      type: object
      properties:
        sweetId: { type: string }
        size: { $ref: "#/components/schemas/SizeId" }
        qty: { type: integer, minimum: 1, maximum: 99 }
        name: { type: string }
        unitPrice: { type: integer, minimum: 0 }
        lineTotal: { type: integer, minimum: 0 }
      required: [sweetId, size, qty, name, unitPrice, lineTotal]
      additionalProperties: false

    LinesRequest:
      type: object
      properties:
        lines: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Line" } }
      required: [lines]
      additionalProperties: false

    Quote:
      type: object
      properties:
        lines: { type: array, items: { $ref: "#/components/schemas/PricedLine" } }
        total: { type: integer, minimum: 0 }
      required: [lines, total]

    Customer:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
        phone: { type: string, pattern: "^[6-9]\\d{9}$" }
        fulfilment: { type: string, enum: [pickup, delivery] }
        address: { type: string, minLength: 10, maxLength: 300 }
      required: [name, phone, fulfilment]
      additionalProperties: false
      description: address is required when fulfilment is delivery.

    PlaceOrderRequest:
      type: object
      properties:
        lines: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Line" } }
        customer: { $ref: "#/components/schemas/Customer" }
        expectedTotal: { type: integer, minimum: 0, description: The total the customer saw (AC-4.3) }
      required: [lines, customer, expectedTotal]
      additionalProperties: false

    HistoryEntry:
      type: object
      properties:
        from: { oneOf: [{ $ref: "#/components/schemas/Stage" }, { type: "null" }] }
        to: { $ref: "#/components/schemas/Stage" }
        by: { type: string, enum: [customer, owner] }
        at: { type: string, format: date-time }
      required: [from, to, by, at]

    Order:
      type: object
      properties:
        id: { type: string, pattern: "^TS-\\d{8}-\\d{4}$" }
        lines: { type: array, items: { $ref: "#/components/schemas/PricedLine" } }
        total: { type: integer, minimum: 0 }
        customer: { $ref: "#/components/schemas/Customer" }
        stage: { $ref: "#/components/schemas/Stage" }
        history: { type: array, items: { $ref: "#/components/schemas/HistoryEntry" } }
        createdAt: { type: string, format: date-time }
      required: [id, lines, total, customer, stage, history, createdAt]

    PublicOrder:
      description: What anyone with the order number may see (AC-5.5). No customer details.
      type: object
      properties:
        id: { type: string, pattern: "^TS-\\d{8}-\\d{4}$" }
        lines: { type: array, items: { $ref: "#/components/schemas/PricedLine" } }
        total: { type: integer, minimum: 0 }
        fulfilment: { type: string, enum: [pickup, delivery] }
        stage: { $ref: "#/components/schemas/Stage" }
        history: { type: array, items: { $ref: "#/components/schemas/HistoryEntry" } }
        createdAt: { type: string, format: date-time }
      required: [id, lines, total, fulfilment, stage, history, createdAt]
      additionalProperties: false

    ErrorBody:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
      required: [code, message]
